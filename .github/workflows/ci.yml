name: CI

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: ${{ matrix.os }} / Python 3.12
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: x86_64
            lock: requirements/dev-linux.lock
          - os: macos-15
            arch: arm64
            lock: requirements/dev-macos.lock
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Check out tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install locked development environment
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = '${{ matrix.arch }}'
          test -f '${{ matrix.lock }}'
          python -m venv .venv
          .venv/bin/python -m pip install -r '${{ matrix.lock }}'
          .venv/bin/python -m pip install --no-build-isolation --no-deps -e '.[dev]'
          .venv/bin/python -m pip check
          mkdir -p "$RUNNER_TEMP/repro-p10"
          .venv/bin/python - <<'PY' > "$RUNNER_TEMP/repro-p10/environment.json"
          import importlib.metadata as metadata
          import json
          import platform
          import sqlite3
          import subprocess
          import sys

          packages = ("pip", "setuptools", "wheel", "build", "pip-tools", "pytest", "ruff", "PyYAML", "typer")
          print(json.dumps({
              "commit": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
              "git_dirty": bool(subprocess.check_output(["git", "status", "--porcelain=v1", "--untracked-files=all"], text=True).strip()),
              "python": platform.python_version(),
              "os": platform.platform(),
              "architecture": platform.machine(),
              "sqlite": sqlite3.sqlite_version,
              "packages": {name: metadata.version(name) for name in packages},
          }, indent=2))
          PY
      - name: Lint and format
        shell: bash
        run: |
          set -euo pipefail
          .venv/bin/python -m ruff check .
          .venv/bin/python -m ruff format --check .
      - name: Complete test suite
        shell: bash
        run: |
          set -euo pipefail
          .venv/bin/python -m pytest --junitxml="$RUNNER_TEMP/repro-p10/junit.xml"
      - name: Build wheel and source distribution
        shell: bash
        run: |
          set -euo pipefail
          .venv/bin/python -m pip check
          .venv/bin/python -m build --no-isolation --outdir "$RUNNER_TEMP/repro-p10/dist" > "$RUNNER_TEMP/repro-p10/build.log" 2>&1 || { cat "$RUNNER_TEMP/repro-p10/build.log"; exit 1; }
          shasum -a 256 "$RUNNER_TEMP"/repro-p10/dist/* > "$RUNNER_TEMP/repro-p10/distribution-sha256.txt"
          .venv/bin/python - <<'PY'
          import os
          import tarfile
          import zipfile
          from pathlib import Path

          dist = Path(os.environ["RUNNER_TEMP"]) / "repro-p10/dist"
          wheels, sources = list(dist.glob("*.whl")), list(dist.glob("*.tar.gz"))
          if len(wheels) != 1 or len(sources) != 1:
              raise SystemExit("expected exactly one wheel and source archive")
          with zipfile.ZipFile(wheels[0]) as archive:
              wheel = archive.namelist()
          with tarfile.open(sources[0]) as archive:
              source = archive.getnames()
          if "repro_runner/cli.py" not in wheel or not any(name.endswith("/src/repro_runner/cli.py") for name in source):
              raise SystemExit("distribution is missing runner source")
          if not any(name.endswith("/pyproject.toml") for name in source):
              raise SystemExit("source archive is missing build metadata")
          if any("/.repro/" in name or "/.venv/" in name or "/out/" in name for name in wheel + source):
              raise SystemExit("distribution includes runtime state or example output")
          PY
          git diff --exit-code
      - name: Check wheel and source installs
        shell: bash
        run: |
          set -euo pipefail
          dist="$RUNNER_TEMP/repro-p10/dist"
          wheels=("$dist"/*.whl)
          sources=("$dist"/*.tar.gz)
          test "${#wheels[@]}" -eq 1 && test -f "${wheels[0]}"
          test "${#sources[@]}" -eq 1 && test -f "${sources[0]}"
          .venv/bin/python scripts/check_installation.py --artifact "${wheels[0]}" --python .venv/bin/python --example examples/simulation --report-dir "$RUNNER_TEMP/repro-p10/wheel"
          .venv/bin/python scripts/check_installation.py --artifact "${sources[0]}" --python .venv/bin/python --example examples/simulation --report-dir "$RUNNER_TEMP/repro-p10/sdist"
      - name: Benchmark harness correctness smoke
        shell: bash
        run: |
          set -euo pipefail
          .venv/bin/python benchmarks/run_benchmark.py --suite compute --smoke --output-dir "$RUNNER_TEMP/repro-p10/benchmark" > "$RUNNER_TEMP/repro-p10/benchmark.log" 2>&1 || { cat "$RUNNER_TEMP/repro-p10/benchmark.log"; exit 1; }
          .venv/bin/python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"]) / "repro-p10/benchmark"
          metadata = json.loads((root / "metadata.json").read_text())
          records = [json.loads(line) for line in (root / "samples.jsonl").read_text().splitlines()]
          if metadata["mode"] != "smoke" or metadata["suites"] != ["compute"] or len(records) != 4:
              raise SystemExit("benchmark smoke metadata or record count is incorrect")
          if any(row["kind"] != "smoke" or row["exit_code"] != 0 or row["included"] for row in records):
              raise SystemExit("benchmark records are not four passing smoke trials")
          if {row["condition"] for row in records} != {"workers=1", "workers=4"}:
              raise SystemExit("benchmark smoke worker conditions are incomplete")
          if any(row["evidence"]["launches"] != 5 or row["evidence"]["counts"].get("executed") != 5 for row in records):
              raise SystemExit("benchmark smoke task counts are incorrect")
          if len({tuple(sorted(row["evidence"]["hashes"].items())) for row in records}) != 1:
              raise SystemExit("benchmark smoke output hashes differ")
          PY
      - name: Upload finite verification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: p10-${{ matrix.os }}-${{ matrix.arch }}-py312-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/repro-p10/environment.json
            ${{ runner.temp }}/repro-p10/junit.xml
            ${{ runner.temp }}/repro-p10/build.log
            ${{ runner.temp }}/repro-p10/distribution-sha256.txt
            ${{ runner.temp }}/repro-p10/dist/*.whl
            ${{ runner.temp }}/repro-p10/dist/*.tar.gz
            ${{ runner.temp }}/repro-p10/wheel/*.json
            ${{ runner.temp }}/repro-p10/wheel/*.log
            ${{ runner.temp }}/repro-p10/sdist/*.json
            ${{ runner.temp }}/repro-p10/sdist/*.log
            ${{ runner.temp }}/repro-p10/benchmark/metadata.json
            ${{ runner.temp }}/repro-p10/benchmark/samples.jsonl
            ${{ runner.temp }}/repro-p10/benchmark.log
          if-no-files-found: warn
          retention-days: 7
