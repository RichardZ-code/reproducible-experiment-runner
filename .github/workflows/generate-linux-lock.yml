name: Generate Linux lock candidate

"on":
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Compile candidate on Linux
        shell: bash
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/lock-resolver"
          env -u PIP_INDEX_URL -u PIP_EXTRA_INDEX_URL -u PIP_NO_INDEX -u PIP_FIND_LINKS PIP_CONFIG_FILE=/dev/null "$RUNNER_TEMP/lock-resolver/bin/python" -m pip install --no-input 'pip-tools==7.6.1' 'setuptools>=77' wheel build
          mkdir -p reports
          env -u PIP_INDEX_URL -u PIP_EXTRA_INDEX_URL -u PIP_NO_INDEX -u PIP_FIND_LINKS PIP_CONFIG_FILE=/dev/null "$RUNNER_TEMP/lock-resolver/bin/python" -m piptools compile --all-build-deps --extra dev --strip-extras --allow-unsafe --output-file requirements/dev-linux.lock pyproject.toml
          "$RUNNER_TEMP/lock-resolver/bin/python" - <<'PY'
          import hashlib
          import json
          import platform
          import subprocess
          import sys
          from pathlib import Path

          def digest(path):
              return hashlib.sha256(Path(path).read_bytes()).hexdigest()

          packages = ["pip", "pip-tools", "setuptools", "wheel", "build"]
          versions = {}
          for package in packages:
              result = subprocess.run(
                  [sys.executable, "-m", "pip", "show", package],
                  capture_output=True, text=True, check=False,
              )
              versions[package] = next(
                  (line.removeprefix("Version: ") for line in result.stdout.splitlines()
                   if line.startswith("Version: ")), None
              )
          candidate = Path("requirements/dev-linux.lock")
          content = candidate.read_text()
          if "--index-url" in content or "--extra-index-url" in content or "@ http" in content:
              raise SystemExit("candidate contains an index or direct HTTP source; inspect before upload")
          record = {
              "source_commit": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
              "pyproject_sha256": digest("pyproject.toml"),
              "candidate_sha256": digest(candidate),
              "command": "python -m piptools compile --all-build-deps --extra dev --strip-extras --allow-unsafe --output-file requirements/dev-linux.lock pyproject.toml",
              "os": platform.platform(),
              "machine": platform.machine(),
              "python": platform.python_version(),
              "versions": versions,
          }
          Path("reports/linux-lock-provenance.json").write_text(json.dumps(record, indent=2) + "\n")
          PY
      - name: Upload candidate and provenance
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-lock-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            requirements/dev-linux.lock
            reports/linux-lock-provenance.json
          if-no-files-found: error
          retention-days: 7
