[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reproducible-experiment-runner"
version = "0.1.0"
description = "Local CLI for reproducible dependency-aware workflows"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "PyYAML>=6,<7",
    "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "build", "pip-tools"]

[project.scripts]
runner = "repro_runner.cli:app"

[tool.setuptools.packages.find]
where = ["src"]
include = ["repro_runner*"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
